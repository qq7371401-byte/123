name: Build executable

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'
        type: choice
        options:
          - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run build.cmd in VS Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
        run: .\build.cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Build
          path: build/
          retention-days: 90
